services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_BUILD_ID: ${AGENT_BUILD_ID:-local}
        AGENT_BUILD_TIME: ${AGENT_BUILD_TIME:-unknown}
    image: ${AGENT_IMAGE:-ghcr.io/eldadfux/openhands:dev}
    container_name: appwrite-agent
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.6}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      AGENT_BUILD_ID: ${AGENT_BUILD_ID:-local}
      AGENT_BUILD_TIME: ${AGENT_BUILD_TIME:-unknown}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${AGENT_UI_IMAGE:-ghcr.io/eldadfux/openhands-ui:dev}
    container_name: appwrite-agent-ui
    ports:
      - "${AGENT_UI_PORT:-3001}:80"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
