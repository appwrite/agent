services:
  openhands:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPENHANDS_IMAGE:-ghcr.io/eldadfux/openhands:dev}
    container_name: appwrite-openhands
    ports:
      - "${OPENHANDS_PORT:-8000}:8000"
    environment:
      OH_SESSION_API_KEYS_0: ${OH_SESSION_API_KEYS_0:-}
      OH_SECRET_KEY: ${OH_SECRET_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o}
    volumes:
      - openhands-workspace:/workspace
    # TCP check — base image may not ship curl.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

volumes:
  openhands-workspace:
