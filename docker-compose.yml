services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ASSISTANT_IMAGE:-ghcr.io/eldadfux/openhands:dev}
    container_name: appwrite-assistant
    ports:
      - "${ASSISTANT_PORT:-8000}:8000"
    environment:
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${ASSISTANT_UI_IMAGE:-ghcr.io/eldadfux/openhands-ui:dev}
    container_name: appwrite-assistant-ui
    ports:
      - "${ASSISTANT_UI_PORT:-3001}:80"
    environment:
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
    depends_on:
      assistant:
        condition: service_healthy
    restart: unless-stopped
